# Antiquarian's Cage — Render Blueprint (hosted demo / friend-testing deployment).
# Free-tier topology: managed Postgres + Key Value (Redis) + ONE public web service that runs the FastAPI backend,
# which serves the console SPA AND the /api and /agent channels AND the RDP-relay WebSockets on one HTTPS origin.
# (Render's free plan has no private services, so there is no separate API/nginx split — uvicorn serves it all.)
# Runs with ALLOW_EDGE_TLS=true (no agent mTLS — requests are still individually signed). See RENDER.md.
# After the first deploy you MUST set PUBLIC_BASE_URL and ALLOWED_ORIGINS to this service's real URL, and fill the
# three secrets marked "sync: false" (generate with: python infrastructure/scripts/generate_secrets.py).

# NOTE: all three resources are pinned to the SAME region (singapore) so the web service can reach the database over
# Render's internal network. If you change the region, change it in all three places or internal DNS will not resolve.

databases:
  - name: cage-db
    databaseName: antiquarians_cage
    plan: free
    region: singapore

services:
  # Redis (Key Value) — used for rate limiting.
  - type: redis
    name: cage-redis
    plan: free
    region: singapore
    ipAllowList: []            # internal only
    maxmemoryPolicy: noeviction

  # One public web service: the FastAPI backend serving the console + /api + /agent + RDP-relay WebSockets.
  - type: web
    name: cage-web
    runtime: docker
    repo: https://github.com/Sravan-1912/Cage-cloud   # this repo (has the current code)
    plan: free
    region: singapore
    numInstances: 1          # the RDP relay pairs a session's two tunnel WebSockets within ONE process — don't scale out
    dockerfilePath: ./infrastructure/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_EDGE_TLS          # relaxes the mTLS / single-DB-role / SMTP production guards for an edge-TLS host
        value: "true"
      - key: AGENT_REQUIRE_MTLS
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: cage-db, property: connectionString }
      - key: MIGRATION_DATABASE_URL
        fromDatabase: { name: cage-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: cage-redis, property: connectionString }
      - key: PUBLIC_BASE_URL         # set after first deploy to https://<cage-web url>
        sync: false
      - key: ALLOWED_ORIGINS         # set to ["https://<cage-web url>"]
        sync: false
      - key: DATA_ENCRYPTION_KEY     # base64 of 32 random bytes
        sync: false
      - key: AUDIT_HMAC_KEY          # base64 of 32 random bytes (MUST differ from above)
        sync: false
      - key: DEVICE_CA_KEY_PASSPHRASE # >= 24 chars
        sync: false
